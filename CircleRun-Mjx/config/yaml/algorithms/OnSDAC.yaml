train:
  total_steps: 10000000
  rollout_steps_per_update: 20000
  update_epochs: 10
  update_batch_size: 128
  rollout_mode: "standard"

network:
  hidden_sizes: [64, 64]
  activation: tanh
  layer_norm: false
  weight_init: kaiming_uniform
  obs_normalize: true
  max_grad_norm: 40.0
  use_critic_norm: true
  critic_norm_coef: 0.001
  critic_target_transform: none

estimator:
  advantage:
    type: gae
    reward_lambda: 0.95
    cost_lambda: 0.95
  gamma: 0.99
  adv_standardize: true

algo:
  cg_damping: 0.1
  cg_max_iters: 15
  line_search_max_iter: 10
  line_search_coeff: 0.8
  target_kl: 0.01
  entropy_coef: 0.0
  vf_coef: 0.5
  actor_lr: 0.0003
  critic_lr: 0.001
  cost_critic_lr: null
  # constraint-first dual update knobs (gradient_integration_update)
  violation_tolerance: 0.0
  constraint_slack: 0.0
  infeasible_reward_scale: 0.0
  # Reference-SDAC `con_zeta` overshoot in cost-only branch. `null` →
  # auto-derive as min(cost_limits) at runtime (matches reference's
  # `con_zeta = np.min(con_thresholds)`). Set explicit float to override.
  con_zeta: null

cost:
  use_cost: true
  discounted: false

logging:
  use_wandb: true
  log_interval: 1
  use_scan: true

meta:
  action_distribution: gaussian
  policy_type: on_policy
  dual_updater: none
